# Local copy of the production setup (Apache + app + MySQL on one server, see
# scripts/setup-full.sh), for testing it before deploying:
#
#   cp docker/prod.env.example .env.prod   # then fill it in
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up --build
#
# then open https://localhost (self-signed certificate: accept the browser
# warning). Like production, only Apache's ports 80/443 are published — the
# app and MySQL are reachable only from inside this network — and the app logs
# into MySQL as a user that can only read/write rows.
name: early-china-coinage-prod

services:
  mysql:
    build: docker/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env.prod}
      # root can only log in from inside the MySQL container itself.
      MYSQL_ROOT_HOST: localhost
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set in .env.prod}
      APP_RO_DB_PASSWORD: ${APP_RO_DB_PASSWORD:?set in .env.prod}
    volumes:
      - mysql-data:/var/lib/mysql
      # Imported only on first start (when mysql-data is empty).
      - ./pg_export/mysql_dump.sql:/docker-entrypoint-initdb.d/01-dump.sql:ro
      - ./scripts/better-auth-schema.sql:/docker-entrypoint-initdb.d/02-better-auth.sql:ro
      - ./docker/mysql/create-app-user.sh:/docker-entrypoint-initdb.d/03-app-user.sh:ro
    healthcheck:
      # Answers over TCP only once first-start initialization has finished
      # (no login needed: ping succeeds as soon as the server responds).
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      retries: 60

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    environment:
      DATABASE_URL: mysql://coinapp:${APP_DB_PASSWORD}@mysql:3306/early_china_coinage
      DATABASE_URL_READONLY: mysql://coinapp_ro:${APP_RO_DB_PASSWORD}@mysql:3306/early_china_coinage
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set in .env.prod}
      BETTER_AUTH_URL: https://localhost
      ADMIN_EMAILS: ${ADMIN_EMAILS:?set in .env.prod}
      AUDIT_LOG_PATH: /app/logs/deletions.log
    volumes:
      - app-logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy

  apache:
    build:
      context: .
      dockerfile: docker/apache/Dockerfile
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app

volumes:
  mysql-data:
  app-logs:
